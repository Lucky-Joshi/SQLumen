name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package manifest is present; documentation-only checks continue."
          fi

      - name: Type check
        shell: bash
        run: |
          if [ -f package.json ]; then npm run typecheck --if-present; fi

      - name: Lint
        shell: bash
        run: |
          if [ -f package.json ]; then npm run lint --if-present; fi

      - name: Test
        shell: bash
        run: |
          if [ -f package.json ]; then npm run test --if-present; fi

      - name: Build
        shell: bash
        run: |
          if [ -f package.json ]; then npm run build --if-present; fi
